spring:
  application:
    name: enterprise-ai-api
  datasource:
    url: ${app.database.url}
    username: ${app.database.username}
    password: ${app.database.password}
    hikari:
      initialization-fail-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

app:
  database:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  identity:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8082/realms/enterprise-ai}
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8082/realms/enterprise-ai/protocol/openid-connect/certs}
    audience: ${OIDC_AUDIENCE:enterprise-ai-api}
  storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    region: ${OBJECT_STORAGE_REGION:}
    bucket: ${OBJECT_STORAGE_BUCKET:}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    path-style-access: ${OBJECT_STORAGE_PATH_STYLE_ACCESS:true}
  ingestion:
    max-original-bytes: ${INGESTION_MAX_ORIGINAL_BYTES:20971520}
    max-extracted-characters: ${INGESTION_MAX_EXTRACTED_CHARACTERS:2000000}
    max-pdf-pages: ${INGESTION_MAX_PDF_PAGES:200}
    poll-interval-ms: ${INGESTION_POLL_INTERVAL_MS:500}
    claim-batch-size: ${INGESTION_CLAIM_BATCH_SIZE:4}
    retry-delay-seconds: ${INGESTION_RETRY_DELAY_SECONDS:2}
    stale-claim-seconds: ${INGESTION_STALE_CLAIM_SECONDS:300}

application:
  version: "@project.version@"

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
