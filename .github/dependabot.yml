version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: monthly
    groups:
      backend-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
