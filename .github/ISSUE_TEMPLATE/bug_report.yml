name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Never include credentials, personal data, or customer content.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal, synthetic-data-only steps.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      placeholder: Commit SHA, OS, Java/Node versions
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and data impact
      description: Use a private security advisory instead if this is sensitive.
    validations:
      required: true
