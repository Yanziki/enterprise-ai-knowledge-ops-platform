name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-verify:
    name: backend-verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: ./mvnw -B -ntp verify

  frontend-verify:
    name: frontend-verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: pnpm lint
      - name: Test
        run: pnpm test --run
      - name: Build
        run: pnpm build

  container-verify:
    name: container-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure development environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build api web
      - name: Start and verify stack
        run: |
          set -a
          source .env
          set +a
          docker compose up --detach --wait
          curl --fail --retry 5 http://localhost:8080/api/v1/system/status
          curl --fail --retry 5 http://localhost:8080/actuator/health/readiness
          docker compose exec -T postgres psql \
            -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'vector';"
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
