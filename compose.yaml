name: enterprise-ai-knowledge-ops-platform

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - platform
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    volumes:
      - ./infra/keycloak/realm-enterprise-ai.json:/opt/keycloak/data/import/realm-enterprise-ai.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
    networks:
      - platform
    restart: unless-stopped

  object-storage:
    image: rustfs/rustfs:1.0.3
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY must be set}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY must be set}
      RUSTFS_CONSOLE_ENABLE: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:9000/health/ready >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - object-storage-rustfs-data:/data
    ports:
      - "${OBJECT_STORAGE_PORT:-9000}:9000"
    networks:
      - platform
    restart: unless-stopped

  object-storage-init:
    image: amazon/aws-cli:2.38.6
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://object-storage:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        aws configure set default.s3.addressing_style path;
        aws s3api head-bucket --bucket "$${OBJECT_STORAGE_BUCKET}" 2>/dev/null
        || aws s3api create-bucket --bucket "$${OBJECT_STORAGE_BUCKET}" >/dev/null;
        if aws s3api get-bucket-policy --bucket "$${OBJECT_STORAGE_BUCKET}" >/dev/null 2>&1;
        then aws s3api delete-bucket-policy --bucket "$${OBJECT_STORAGE_BUCKET}"; fi;
        if aws s3api get-bucket-policy --bucket "$${OBJECT_STORAGE_BUCKET}" >/dev/null 2>&1;
        then echo "bucket policy still present" >&2; exit 1; fi;
        echo "bucket $${OBJECT_STORAGE_BUCKET} is private (no bucket policy)"
    networks:
      - platform
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: container
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8082/realms/enterprise-ai}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/enterprise-ai/protocol/openid-connect/certs
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-enterprise-ai-api}
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_PATH_STYLE_ACCESS: "true"
      RETRIEVAL_EMBEDDING_MODE: ${RETRIEVAL_EMBEDDING_MODE:-deterministic-smoke}
      RETRIEVAL_OPENAI_BASE_URL: ${RETRIEVAL_OPENAI_BASE_URL:-https://api.openai.com/v1/}
      RETRIEVAL_OPENAI_MODEL: ${RETRIEVAL_OPENAI_MODEL:-}
      RETRIEVAL_OPENAI_API_KEY: ${RETRIEVAL_OPENAI_API_KEY:-}
      RETRIEVAL_OPENAI_DIMENSION: ${RETRIEVAL_OPENAI_DIMENSION:-0}
      RETRIEVAL_OPENAI_SEND_DIMENSIONS: ${RETRIEVAL_OPENAI_SEND_DIMENSIONS:-false}
      APP_RETRIEVAL_WORKER_ENABLED: ${RETRIEVAL_WORKER_ENABLED:-true}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-deterministic-smoke}
      ANSWER_OPENAI_BASE_URL: ${ANSWER_OPENAI_BASE_URL:-https://api.openai.com/v1/}
      ANSWER_OPENAI_MODEL: ${ANSWER_OPENAI_MODEL:-}
      ANSWER_OPENAI_API_KEY: ${ANSWER_OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${API_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp
    init: true
    networks:
      - platform
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/healthz | grep -q healthy
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    init: true
    networks:
      - platform
    restart: unless-stopped

volumes:
  postgres-data:
  object-storage-rustfs-data:

networks:
  platform:
    driver: bridge
